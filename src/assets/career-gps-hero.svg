<svg width="920" height="720" viewBox="0 0 920 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Career GPS story map</title>
  <desc id="desc">A clean paper-style map showing a job seeker moving from confusion to interviews with Career GPS.</desc>
  <rect width="920" height="720" rx="48" fill="#FBFAF6"/>
  <rect x="40" y="42" width="840" height="636" rx="38" fill="#FFFFFF" stroke="#111827" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M105 170 C206 95 289 166 360 244 C450 342 552 184 650 239 C756 298 739 443 823 519" stroke="#C9B8A2" stroke-width="18" stroke-linecap="round"/>
  <path d="M105 170 C206 95 289 166 360 244 C450 342 552 184 650 239 C756 298 739 443 823 519" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 14"/>

  <g font-family="Inter, Arial">
    <rect x="80" y="78" width="300" height="90" rx="24" fill="#F7F1E8" stroke="#111827" stroke-opacity="0.1"/>
    <text x="108" y="118" fill="#111827" font-size="24" font-weight="900">Monday morning</text>
    <text x="108" y="146" fill="#6B7280" font-size="18" font-weight="650">12 tabs. No clear next move.</text>

    <rect x="500" y="76" width="318" height="104" rx="24" fill="#EAF8EF" stroke="#166534" stroke-opacity="0.18"/>
    <text x="528" y="116" fill="#166534" font-size="18" font-weight="950" letter-spacing="2">CAREER GPS</text>
    <text x="528" y="148" fill="#111827" font-size="24" font-weight="900">Find the real blocker first</text>

    <rect x="110" y="286" width="220" height="156" rx="28" fill="#FFFFFF" stroke="#111827" stroke-opacity="0.12"/>
    <text x="140" y="330" fill="#B45309" font-size="16" font-weight="950" letter-spacing="1.5">BEFORE</text>
    <text x="140" y="366" fill="#111827" font-size="22" font-weight="900">Scattered tools</text>
    <text x="140" y="397" fill="#6B7280" font-size="17" font-weight="650">Resume app</text>
    <text x="140" y="424" fill="#6B7280" font-size="17" font-weight="650">ATS checker</text>

    <rect x="360" y="288" width="230" height="164" rx="28" fill="#111827"/>
    <text x="398" y="338" fill="#A7F3D0" font-size="16" font-weight="950" letter-spacing="1.5">DIAGNOSIS</text>
    <text x="398" y="392" fill="#FFFFFF" font-size="68" font-weight="1000" letter-spacing="-5">84</text>
    <text x="488" y="386" fill="#D1D5DB" font-size="18" font-weight="800">health</text>
    <text x="398" y="424" fill="#D1D5DB" font-size="18" font-weight="700">roadmap created</text>

    <rect x="626" y="300" width="204" height="150" rx="28" fill="#FFFFFF" stroke="#166534" stroke-opacity="0.22"/>
    <text x="656" y="344" fill="#166534" font-size="16" font-weight="950" letter-spacing="1.5">AFTER</text>
    <text x="656" y="380" fill="#111827" font-size="22" font-weight="900">One route</text>
    <text x="656" y="411" fill="#6B7280" font-size="17" font-weight="650">AI workflows</text>
    <text x="656" y="438" fill="#6B7280" font-size="17" font-weight="650">Human coaching</text>

    <circle cx="105" cy="170" r="17" fill="#111827"/>
    <circle cx="360" cy="244" r="17" fill="#111827"/>
    <circle cx="650" cy="239" r="17" fill="#111827"/>
    <circle cx="823" cy="519" r="17" fill="#16A34A"/>

    <rect x="92" y="540" width="736" height="72" rx="24" fill="#F3F4F6" stroke="#111827" stroke-opacity="0.1"/>
    <text x="124" y="584" fill="#111827" font-size="22" font-weight="900">Assessment → Report → Plan → Interviews</text>
    <text x="124" y="606" fill="#6B7280" font-size="15" font-weight="750" letter-spacing="1">A HUMAN CAREER STORY, NOT ANOTHER TOOL STACK</text>
  </g>
</svg>
